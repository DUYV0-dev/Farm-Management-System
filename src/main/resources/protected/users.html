<section id="adminUsers" class="admin-panel" aria-label="Quản lý người dùng">
  <div class="admin-toolbar">
    <form id="searchUsers" role="search"><label for="adminSearch">Tìm người dùng</label><div class="admin-search"><input id="adminSearch" name="search" maxlength="100" placeholder="Tên đăng nhập, họ tên hoặc email" type="search"><button type="submit">Tìm kiếm</button></div></form>
    <button id="createUserButton" type="button" class="primary" hidden>Thêm người dùng</button>
    <button id="refreshUsers" type="button">Tải lại</button>
  </div>
  <p id="adminUserSummary" class="muted" role="status"></p>
  <div id="userList"></div>
  <div class="admin-pagination"><button type="button" id="previousUsers">Trang trước</button><span id="userPage" aria-live="polite"></span><button type="button" id="nextUsers">Trang sau</button></div>
</section>
