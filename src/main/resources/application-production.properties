# Required secrets come from the deployment environment or a secret manager.
app.production=true
app.open-browser=false
app.frontend.working-tree=false
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:farm_app}
spring.datasource.password=${DB_PASSWORD}
auth.jwt.secret=${JWT_SECRET}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB
logging.file.name=${LOG_FILE:logs/backend.log}
