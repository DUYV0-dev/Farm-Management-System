spring.application.name=Farm Management System N02
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farm_management_erd_v1}
spring.datasource.username=${DB_USERNAME:farm_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.flyway.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
auth.jwt.secret=${JWT_SECRET}
auth.jwt.issuer=farm-management-n02
auth.jwt.audience=farm-management-clients
server.error.include-message=never
server.error.include-stacktrace=never
logging.file.name=logs/backend.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=10MB
