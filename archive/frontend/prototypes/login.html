<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriManage - Sign In / Register</title>
    <link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="../shared/design.css"><link rel="stylesheet" href="../shared/icons.css"><script src="bridge.js"></script></head>
<body>
    <div class="auth-page-container">
        <div class="auth-card">
            <!-- Brand Logo -->
            <div class="auth-brand">
                <div class="logo-icon shadow-sm">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <h2>AgriManage</h2>
                <p class="subtitle" style="font-size: 15px;">Smart Farm Management Platform</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Sign In</button>
                <button class="auth-tab" id="tabRegister">Create Account</button>
            </div>

            <!-- Sign In Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <div style="position: relative;">
                        <input type="text" id="loginEmail" required placeholder="Tên đăng nhập" autocomplete="username">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-primary btn-large" style="width: 100%; justify-content: center;">
                    Sign In to Dashboard <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="e.g. Alex Rivera">
                </div>
                <div class="form-group"><label>Tên đăng nhập</label><input id="regUsername" required minlength="3" maxlength="50"></div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="regEmail" required placeholder="alex@agrimanage.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required minlength="12" maxlength="128" placeholder="12–128 ký tự, có chữ và số">
                </div>
                <div class="form-group"><label>Tên trang trại</label><input id="regFarmName" required maxlength="100"></div><div class="form-group"><label>Địa chỉ</label><input id="regAddress" required maxlength="255"></div><div class="form-group"><label>Diện tích (ha)</label><input id="regArea" type="number" required min="0.01" max="9999999" step="0.01"></div><button type="submit" class="btn-primary btn-large" style="width: 100%; justify-content: center; margin-top: 24px;">
                    Đăng ký trang trại <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="./js/common.js"></script>
    <script src="./js/auth.js"></script>
</body>
</html>
