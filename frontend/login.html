<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriManage - Sign In / Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="auth-page-container">
        <div class="auth-card">
            <!-- Brand Logo -->
            <div class="auth-brand">
                <div class="logo-icon shadow-sm">
                    <i class="fa-solid fa-seedling"></i>
                </div>
                <h2>AgriManage</h2>
                <p class="subtitle" style="font-size: 15px;">Smart Farm Management Platform</p>
            </div>

            <!-- Demo Account Pills -->
            <div style="text-align: center; margin-bottom: 24px;">
                <span style="font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px;">Quick Demo Login:</span>
                <div class="demo-account-pills" style="justify-content: center;">
                    <button class="demo-pill" id="demoManager"><i class="fa-solid fa-user-gear"></i> Farm Manager</button>
                    <button class="demo-pill" id="demoAgronomist"><i class="fa-solid fa-wheat-awn"></i> Agronomist</button>
                    <button class="demo-pill" id="demoTech"><i class="fa-solid fa-wrench"></i> Technician</button>
                </div>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">Sign In</button>
                <button class="auth-tab" id="tabRegister">Create Account</button>
            </div>

            <!-- Sign In Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <div style="position: relative;">
                        <input type="text" id="loginEmail" required placeholder="manager@agrimanage.com" value="manager@agrimanage.com">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" value="password123">
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; font-size: 14px; margin: 0;">
                        <input type="checkbox" checked style="width: auto;"> Remember me
                    </label>
                    <a href="javascript:void(0)" onclick="alert('Demo Mode: Use password123 to log in.')" style="font-size: 13px; color: var(--primary); font-weight: 700; text-decoration: none;">Forgot Password?</a>
                </div>
                <button type="submit" class="btn-primary btn-large" style="width: 100%; justify-content: center;">
                    Sign In to Dashboard <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="regName" required placeholder="e.g. Alex Rivera">
                </div>
                <div class="form-group">
                    <label>Role / Position</label>
                    <select id="regRole" required>
                        <option value="Farm Manager">Farm Manager</option>
                        <option value="Agronomist">Agronomist</option>
                        <option value="Technician">Technician</option>
                        <option value="Field Supervisor">Field Supervisor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="text" id="regEmail" required placeholder="alex@agrimanage.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="regPassword" required placeholder="Create a strong password">
                </div>
                <button type="submit" class="btn-primary btn-large" style="width: 100%; justify-content: center; margin-top: 24px;">
                    Create Account <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="./js/common.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
