<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thu hoạch</title><link rel="stylesheet" href="/style.css"><script src="/ui/features/harvest/harvest.js" defer></script></head>
<body class="signed-in"><main><section>
<h1>Quản lý thu hoạch</h1><p>Ghi nhận sản lượng thực tế và xem lịch sử theo mùa vụ.</p>
<p id="notice" role="status" aria-live="polite"></p>
<label>Trang trại<select id="farm"></select></label>
<form id="filters"><label>Mùa vụ<select id="season"><option value="">Tất cả mùa vụ</option></select></label><label>Từ ngày<input name="fromDate" type="date"></label><label>Đến ngày<input name="toDate" type="date"></label><button>Lọc lịch sử</button></form>
<form id="create" hidden><h2>Ghi nhận thu hoạch</h2><p id="seasonInfo"></p><label>Ngày thu hoạch<input name="harvestDate" type="date" required></label><label>Sản lượng<input name="quantity" type="number" min="0.001" max="9999999999999.999" step="0.001" required></label><label>Chất lượng (tùy chọn)<input name="quality" maxlength="50" placeholder="Ví dụ: Loại A"></label><p>Bản ghi được xác nhận ngay khi lưu và giữ nguyên trong lịch sử.</p><button>Lưu thu hoạch</button></form>
<details id="configuration" hidden><summary>Cấu hình ngày và đơn vị của mùa vụ</summary><form id="configure"><label>Tên mùa vụ<input name="name" maxlength="100" required></label><label>Ngày bắt đầu dự kiến<input name="startDate" type="date" required></label><label>Ngày kết thúc dự kiến<input name="endDate" type="date" required></label><label>Đơn vị sản lượng<select name="unitId" id="unit" required></select></label><button>Lưu cấu hình mùa vụ</button></form></details>
<h2>Lịch sử thu hoạch</h2><p id="count"></p><div style="overflow-x:auto"><table><thead><tr><th>Mã</th><th>Mùa vụ / khu đất / cây</th><th>Ngày thu hoạch</th><th>Sản lượng</th><th>Chất lượng</th><th>Trạng thái</th><th>Người ghi</th></tr></thead><tbody id="history"></tbody></table></div>
<div class="actions"><button id="previous" type="button">Trang trước</button><button id="next" type="button">Trang sau</button></div>
</section></main></body></html>
